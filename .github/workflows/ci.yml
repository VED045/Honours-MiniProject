name: Validate research project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-torch.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fraud-research .
      - name: Container health and private API smoke
        run: |
          docker run -d --name fraud-api -p 8000:8000 -e API_KEY=ci-only-private-key-at-least-24-characters fraud-research
          curl --retry 20 --retry-delay 2 --retry-all-errors --max-time 10 --fail http://localhost:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/models)" = "401"
          curl --fail -H 'Authorization: Bearer ci-only-private-key-at-least-24-characters' http://localhost:8000/api/v1/models
      - name: Container logs
        if: failure()
        run: docker logs fraud-api

